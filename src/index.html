<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earthquake Watch – Erdbebenübersicht</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="index.html">Earthquake Watch</a>
      <nav aria-label="Hauptnavigation">
        <a href="index.html" aria-current="page">Übersicht</a>
        <a href="about.html">Über die Daten</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>Erdbeben im gewählten Zeitraum</h1>
    <p class="lead">Daten des USGS Earthquake Catalog. Den Zeitraum und die Mindestmagnitude wählen, dann laden.</p>

    <form id="quake-form" novalidate>
      <div class="field">
        <label for="start">Startdatum</label>
        <input type="date" id="start" name="start" value="2026-11-01">
      </div>
      <div class="field">
        <label for="end">Enddatum</label>
        <input type="date" id="end" name="end" value="2026-11-05">
      </div>
      <div class="field">
        <label for="minmag">Mindestmagnitude (0–10)</label>
        <input type="number" id="minmag" name="minmag" value="4" step="0.1" inputmode="decimal">
      </div>
      <div class="field">
        <label for="limit">Max. Ergebnisse (1–100)</label>
        <input type="number" id="limit" name="limit" value="20" step="1" inputmode="numeric">
      </div>
      <button type="button" id="load-btn">Erdbeben laden</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite">Noch keine Daten geladen.</p>

    <div class="table-scroll">
      <table id="results" hidden>
        <caption class="sr-only">Erdbeben sortiert nach zeit</caption>
        <thead>
          <tr>
            <th scope="col">Ort</th>
            <th scope="col">Magnitude</th>
            <th scope="col">Zeitpunkt</th>
            <th scope="col">Tiefe</th>
            <th scope="col">USGS</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>Legacy-Projekt LEG-04</span>
      <a href="lizenz.html">Datenlizenz</a>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
